name: Delete Friend from Issue

permissions:
  contents: write
  issues: write

on:
  issues:
    types: [labeled]

jobs:
  delete-friend:
    if: contains(github.event.issue.labels.*.name, 'delete-link')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run script
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/delete-link.js

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/friends/
          git commit -m "Delete friend link for @${{ github.event.issue.user.login }}" || echo "No changes"
          git pull --rebase origin main
          git push origin main || echo "No changes"

      - name: Close issue
        uses: peter-evans/close-issue@v2
        with:
          comment: "Successfully deleted your friend link."
